    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">

    <!--
        GitHub Pages serves this page at whatever address was requested
        (e.g. /forum/thread.php), so relative links would resolve against the
        wrong folder. Set the base to the site root first: "/uws/" on the
        jddeitch.github.io project site, "/" on www.uwsonline.com.
        Then send addresses from the old PHP site to their new pages.
    -->
    <script>
    (function() {
        var root = location.hostname.endsWith('github.io')
            ? '/' + location.pathname.split('/')[1] + '/'
            : '/';
        var base = document.createElement('base');
        base.href = root;
        document.head.appendChild(base);

        var path = location.pathname.slice(root.length - 1).toLowerCase();
        var oldPages = {
            '/index.php': '',
            '/about-uws.php': 'about.html',
            '/subscribe.php': 'subscribe.html',
            '/thankyou.php': 'thankyou.html'
        };
        if (path === '/forum' || path.indexOf('/forum/') === 0) {
            location.replace('https://forum.uwsonline.com/');
        } else if (oldPages.hasOwnProperty(path)) {
            location.replace(root + oldPages[path] + location.search + location.hash);
        }
    })();
    </script>

    <title>Page Not Found - United We Stand</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./favicon.png">
    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    </script>
